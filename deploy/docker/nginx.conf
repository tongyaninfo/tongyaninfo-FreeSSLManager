server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;
    # 目录补斜杠使用相对跳转，保留对外映射端口及反向代理的 HTTPS 协议。
    absolute_redirect off;

    # 官方入口脚本将实际容器 DNS 写入模板，后端重启或替换后自动重新解析。
    resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;
    resolver_timeout 5s;
    set $api_backend api:8080;

    location ^~ /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /api {
        return 308 /api/;
    }

    # MCP 与 OAuth 必须代理至后端，不能落入 SPA；传输及授权由后端独立检查。
    location = /mcp {
        client_max_body_size 256k;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
        proxy_buffering off;
        proxy_cache off;
    }

    location ^~ /oauth/mcp/ {
        client_max_body_size 256k;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /.well-known/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 页面路由返回入口文件，缺失的静态文件保持 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(?:js|css|map|png|jpe?g|gif|ico|svg|woff2?|ttf)$ {
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
