name: 功能建议
description: 提出新能力或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 Issue 与 [CHANGELOG](../CHANGELOG.md) 中的已知边界，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前在什么场景下不方便？请描述真实的使用痛点，而不是直接给实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望如何解决？如果能说明对现有流程的影响更好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      multiple: true
      options:
        - 云账号与同步
        - 域名与 DNS
        - 证书申请 / 同步 / 吊销
        - 部署目标与部署执行
        - 周期计划
        - 邮件与到期提醒
        - 配置迁移
        - MCP / OAuth / API Key / 审计
        - 登录、权限与审计
        - 前端界面与交互
        - 文档与工程
        - 其他
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 平台与范围
      description: 涉及哪些云厂商、部署目标或使用方式？是否属于当前已知边界之外（如泛域名、IP 证书、私有 CA、桌面端）。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有找到重复建议。
          required: true
        - label: 我理解功能实现需要维护者评估，提案不代表已承诺实现。
          required: true
