name: 缺陷报告
description: 报告一个可复现的缺陷（请勿包含真实凭据、真实域名解析记录或生产数据）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有相同问题。
        **安全漏洞不要用本模板**，请按 SECURITY.md 的渠道私下报告。
        请对日志、截图和配置中的凭据、域名、IP、证书与账号信息打码或替换为合成示例。

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？期望发生什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、完整的复现步骤。
      placeholder: |
        1. 进入 ...
        2. 点击 ...
        3. 观察 ...
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: 影响模块
      multiple: true
      options:
        - 云账号与同步
        - 域名与 DNS
        - 证书申请 / 同步 / 吊销
        - 部署目标与部署执行
        - 周期计划
        - 邮件与到期提醒
        - 配置迁移
        - MCP / OAuth / API Key / 审计
        - 登录、权限与审计
        - 前端界面与交互
        - 构建、测试或部署
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 根目录 VERSION 或 git commit；请不要粘贴内部构建号。
      placeholder: "例如 1.0.0"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 运行方式
      multiple: false
      options:
        - 源码运行（dotnet run + npm run dev）
        - 生产构建 + 自建反向代理
        - Docker / 容器
        - 其他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、.NET SDK、Node.js、浏览器版本；不要包含主机名、内网地址或账号信息。
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图（已脱敏）
      description: 只保留与问题相关的行；请先移除凭据、真实域名、IP、证书 ID 与指纹。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有找到重复问题。
          required: true
        - label: 我已移除真实凭据、真实域名解析记录、证书私钥与生产环境数据。
          required: true
        - label: 这不是安全漏洞（安全漏洞请按 SECURITY.md 私下报告）。
          required: true
