<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{Title}}</title>
</head>
<body style="margin:0;padding:24px;background:#f3f5f8;color:#203047;font-family:Arial,'Microsoft YaHei',sans-serif;">
  <table role="presentation" style="width:100%;max-width:960px;margin:0 auto;border-collapse:collapse;background:#fff;">
    <tr><td style="padding:28px;background:#193a65;color:#fff;">
      <div style="font-size:13px;letter-spacing:1px;">SSL 证书管理平台</div>
      <h1 style="margin:12px 0 0;font-size:24px;">{{Title}}</h1>
    </td></tr>
    <tr><td style="padding:24px;">
      <p style="margin-top:0;line-height:1.8;">本轮共有 <strong>{{AlertCount}}</strong> 项证书提醒。当前预警阈值为到期前 <strong>{{DaysBeforeExpiry}}</strong> 天，请核对证书续签与部署情况。</p>
      <table style="width:100%;border-collapse:collapse;font-size:13px;line-height:1.6;">
        <thead><tr style="background:#eef3f9;text-align:left;">
          <th style="padding:10px;border:1px solid #dce3ed;">域名</th>
          <th style="padding:10px;border:1px solid #dce3ed;">云账号</th>
          <th style="padding:10px;border:1px solid #dce3ed;">证书别名</th>
          <th style="padding:10px;border:1px solid #dce3ed;">到期时间（UTC）</th>
          <th style="padding:10px;border:1px solid #dce3ed;">剩余天数</th>
        </tr></thead>
        <tbody>{{AlertRows}}</tbody>
      </table>
      <p style="margin-bottom:0;padding:14px;background:#fff6df;color:#795a16;line-height:1.8;">最近检查说明：本邮件反映系统在生成时间的最近一次证书记录检查；云端同步可能存在延迟。请在管理平台核验最新到期时间。已续签、无需处理的提醒可在平台中解除或忽略。</p>
    </td></tr>
    <tr><td style="padding:18px 24px;border-top:1px solid #e7ecf3;color:#66768b;font-size:12px;line-height:1.8;">
      生成时间：{{GeneratedAtUtc}}（UTC）<br>
      此邮件由系统自动生成。SMTP 服务器受理只表示发送请求已提交，不代表收件人已经收到。
    </td></tr>
  </table>
</body>
</html>
